<!-- header without showing progress-->
<div *ngIf="!randomizationService.showFinalPageComponent" class="button-header-container">
    <span class="white-box" *ngIf="!showRecalibration" >
        <div>
            <span style="font-weight: bold;">{{selectedInputType$ | async}}</span>
        </div>
    </span>
</div>
        
        

<!-- content -->
<div id="content" class="content" >

    <!-- initial explanation contains first calibration (for test mode) -->
    <app-initial-explanation *ngIf="showInitialExplanation" (closeMe)="setShowInitialExplanation(false);"></app-initial-explanation>

    <!-- re-calibration for mix2 -->
    <app-calibration *ngIf="showRecalibration && !randomizationService.everythingDone"></app-calibration>

    <app-test-input-methods (endTestEvent)="showTestMode=false;" *ngIf="!showRecalibration && showTestMode && !(randomizationService.everythingDone || randomizationService.showFinalPageComponent)"></app-test-input-methods>

    <app-final-page *ngIf="randomizationService.everythingDone || randomizationService.showFinalPageComponent"></app-final-page>
    
    <img id="arrow" class="arrow" src="assets/arrow.png" />

    <div style="height: 100%;" *ngIf="!showInitialExplanation && !showTestMode && !showRecalibration && !(randomizationService.everythingDone || randomizationService.showFinalPageComponent)"> 
        <!-- click task -->
        <div style="height: 100%;">            
            <app-click *ngIf="(selectedTask$ | async) == TaskType.SELECT"></app-click>
        </div>
        <!-- explanation pop up -->
        <div *ngIf="showTaskPopup" style="display:flex;justify-content:center;">
            <div class="popup-background"></div>
                <div class="Popup">
                    <div class="popup-header">
                        Your Input Method is:
                        <span style="font-weight: bold; color: var(--blue);">{{selectedInputType}}</span>
                    </div>
                    <div style="margin-bottom: 45px;">
                        {{randomizationService.inputMethodInstructions}}
                    </div>
                    <!-- <div style="margin-bottom: 20px;">
                        <strong style="font-size: 25px; vertical-align: top;">> </strong>{{randomizationService.taskInstructions}}
                    </div> -->
                    <div *ngIf="selectedInputType == InputType.MAGIC || selectedInputType == InputType.NINJA" style="margin-bottom: 20px; padding: 5px; color: var(--apricot); border: 3px solid var(--apricot); border-radius: 5px;">
                        ⚠ Calibration necessary! Ask the instructor for help.
                    </div>
                    <button
                        (click)="showTaskPopup=false; startExperiment(); this.blur($event)"
                         
                        [id]="
                        selectedInputType == InputType.MOUSE ? 'InputTypeIsMouse' :
                        selectedInputType == InputType.EYE ? 'InputTypeIsEye' :
                        selectedInputType == InputType.NINJA ? 'InputTypeIsNinja' :
                        selectedInputType == InputType.MAGIC ? 'InputTypeIsMagic' :
                        'InputTypeElse'
                        "
                        [disabled] = "!baseTaskComponent || !baseTaskComponent.secondWindowLoaded">
                        <div style="display:flex;align-items:center;">
                            <mat-icon *ngIf="!baseTaskComponent || !baseTaskComponent.secondWindowLoaded">
                                <mat-spinner diameter="20">
                            </mat-spinner>
                            </mat-icon>
                            <span style="padding: 5px 5px"> START EXPERIMENT </span>
                        </div>
                    </button>
                    <!-- <div *ngIf="selectedInputType != InputType.MAGIC && selectedInputType != InputType.NINJA" style="width: 200px; font-size: 12px; line-height:15px; margin: auto; margin-top: 15px;">If you cannot complete a task, click the skip button at the top.</div>
                    <div *ngIf="selectedInputType == InputType.MAGIC || selectedInputType == InputType.NINJA" style="width: 200px; font-size: 12px; line-height:15px; margin: auto; margin-top: 15px;">If you cannot complete a task, press esc and then click the skip button.</div>            -->
                </div>
        </div>
    </div>

</div>
