<!DOCTYPE html>
<html lang="en" style="height: 100%;">
<head>
  <meta charset="UTF-8">
  <title> SECOND SCREEN </title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="../../../favicon.ico?v=3">
  <style>
    body {
      padding: 0 !important;
      height: 100%;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(93, 93, 93, 0.869);
      color: white;
      font-family: Helvetica Neue Light, Helvetica Neue, Helvetica, Arial, Lucida Grande, sans-serif;
      font-size: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .hidden { 
      display: none; 
    }
    button {
      background-color: transparent;
      color:transparent;
      border: transparent;
    }
  </style>
</head>
<body>

  <div style="height: 100%" id="outletElement">
    <!-- this is where the content will go - makes it possible to change content without removing scripts from body -->
  </div>
  
  <div id="step1" class="overlay">
    This is the second Window. 
    Please make sure that it is placed on the second screen (the one on the left)! 
    <button id="doneStep1"> DONE </button>
  </div>

  <div id="step2" class="overlay hidden">
    Great, now use Full View mode!
    <button id="doneStep2">FULL VIEW MODE</button>
  </div>


  <script>
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        console.log('[SecondWindow] Space pressed');
        if (window.opener) {
          window.opener.postMessage('space-pressed', '*');
        }
      }
    });

    <!-- Go full screen-->
    document.addEventListener("DOMContentLoaded", () => {
      const doneStep1Btn = document.getElementById("doneStep1");
      const doneStep2Btn = document.getElementById("doneStep2");
      const step1 = document.getElementById("step1");
      const step2 = document.getElementById("step2");

      doneStep1Btn.addEventListener("click", () => {
          step1.classList.add("hidden");
          step2.classList.remove("hidden");
      });

      doneStep2Btn.addEventListener("click", () => {
        // Try to go fullscreen
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) { // Safari
          document.documentElement.webkitRequestFullscreen();
        } else if (document.documentElement.msRequestFullscreen) { // IE11
          document.documentElement.msRequestFullscreen();
        }

        // If it worked, hide step2 overlay
        document.addEventListener("fullscreenchange", () => {
          if (document.fullscreenElement) {
            step2.classList.add("hidden");
          }
        });
      });
    });
  </script>
</body>
</html>
